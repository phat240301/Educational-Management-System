name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore EduManagement.Engine.slnx

      - name: Build
        run: dotnet build EduManagement.Engine.slnx --no-restore -c Release

      - name: Test
        run: dotnet test EduManagement.Engine.slnx --no-build -c Release --verbosity normal

  docker-build:
    name: Docker Build (Api & Worker)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/EduManagement.Api/Dockerfile
          push: false
          tags: edu-api:ci

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/EduManagement.Worker/Dockerfile
          push: false
          tags: edu-worker:ci
